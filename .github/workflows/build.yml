name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_description:
        description: "Build description (optional)"
        required: false
        type: string
        default: "Android build"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Optional: configure these four secrets for a stable release signature.
      # If they are absent, build.gradle.kts uses the generated debug keystore.
      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > composeApp/release-keystore.p12
            if keytool -list -keystore composeApp/release-keystore.p12 \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "TEF_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            else
              echo "::warning::The supplied keystore could not be opened; using the generated debug keystore."
              rm -f composeApp/release-keystore.p12
            fi
          fi

      - name: Build Android Release APK
        env:
          TEF_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TEF_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TEF_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${TEF_RELEASE_SIGNING:-false}" = "true" ]; then
            ./gradlew :composeApp:assembleRelease \
              -PTEF_RELEASE_KEYSTORE_FILE=release-keystore.p12 \
              --no-daemon
          else
            ./gradlew :composeApp:assembleRelease \
              --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEFManager-Android
          path: composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        run: |
          echo "## Android build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Description: ${{ github.event.inputs.build_description }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signature: optional release keystore when configured, otherwise generated debug keystore" >> "$GITHUB_STEP_SUMMARY"
